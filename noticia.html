<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noticia | AmbiTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<!-- ICONS — necesario para los íconos del nav (fa-twitch, fa-home, etc) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<!-- CSS GLOBAL + NAV — mismos que index.html, para que el menú flotante se vea y funcione igual -->
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="noticia/noticia.css">
</head>
<body>

    <!-- ══════════════════════════════════════════════
    CONTENIDO — todo se arma por JS según el id en la URL
    (noticia.html?id=xxx)
    ══════════════════════════════════════════════ -->
    <main class="noticia-page" id="noticia-page">

        <a class="noticia-back" href="index.html#noticias">‹ Volver a Noticias</a>

        <div class="noticia-header">
            <div class="noticia-header-imgwrap" id="noticia-header-imgwrap">
                <img id="noticia-header-img" src="" alt="">
                <div class="noticia-header-body">
                    <div class="noticia-header-meta">
                        <span class="noticia-badge" id="noticia-badge"></span>
                        <span class="noticia-header-fecha" id="noticia-fecha"></span>
                    </div>
                    <h1 class="noticia-header-title" id="noticia-title"></h1>
                </div>
            </div>
        </div>

        <div class="noticia-content" id="noticia-body">
            <!-- bloques (texto / imagen / galeria) inyectados por noticia.js, en el orden del JSON -->
        </div>

    </main>

    <script src="noticia/noticia.js"></script>

</body>
</html>
